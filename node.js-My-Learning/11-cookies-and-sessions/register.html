<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

  .login-wrap {
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    font-family: 'DM Sans', sans-serif;
  }

  .login-card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 2.5rem 2.25rem 2rem;
    width: 100%;
    max-width: 360px;
  }

  .login-heading {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--color-text-primary);
    margin: 0 0 4px;
    line-height: 1.2;
  }

  .login-sub {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin: 0 0 1.75rem;
  }

  .field {
    margin-bottom: 1rem;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--color-text-secondary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    box-sizing: border-box;
    height: 40px;
    padding: 0 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--color-text-primary);
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .field input:focus {
    border-color: var(--color-border-primary);
    box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
  }

  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .field-row label {
    margin-bottom: 0;
  }

  .forgot {
    font-size: 12px;
    color: var(--color-text-secondary);
    text-decoration: none;
    transition: color 0.15s;
  }

  .forgot:hover {
    color: var(--color-text-primary);
  }

  .remember-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 1rem 0 1.25rem;
  }

  .remember-row input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: #2C2C2A;
    cursor: pointer;
  }

  .remember-row label {
    font-size: 13px;
    color: var(--color-text-secondary);
    cursor: pointer;
    user-select: none;
  }

  .btn-signin {
    width: 100%;
    height: 42px;
    background: #2C2C2A;
    color: #F1EFE8;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: var(--border-radius-md);
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
  }

  .btn-signin:hover {
    opacity: 0.88;
  }

  .btn-signin:active {
    transform: scale(0.98);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 1.25rem 0;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: var(--color-border-tertiary);
  }

  .divider span {
    font-size: 11px;
    color: var(--color-text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .btn-google {
    width: 100%;
    height: 40px;
    background: transparent;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--color-text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s;
  }

  .btn-google:hover {
    background: var(--color-background-secondary);
  }

  .signup-line {
    text-align: center;
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-top: 1.25rem;
  }

  .signup-line a {
    color: var(--color-text-primary);
    text-decoration: none;
    font-weight: 500;
  }

  .signup-line a:hover {
    text-decoration: underline;
  }
</style>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
</head>

<body>
  <div class="login-wrap">
    <div class="login-card">

      <h1 class="login-heading">Register</h1>
      <p class="login-sub">Create new account to continue</p>

      <form action="/lesson11/register" method="POST">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <div class="field-row">
            <label for="password">Password</label>
          </div>
          <input type="password" id="password" name="password" placeholder="Password goes here.." required />
        </div>
        <button type="submit" class="btn-signin">Sign Up</button>
      </form>

      <p class="signup-line">Have an account? <a href="/lesson11">Sign in</a></p>
    </div>
  </div>
</body>

</html>
